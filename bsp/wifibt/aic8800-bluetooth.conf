[aic8800]
# TBoard wiring. This UART must not be used by a console/getty or another attach tool.
device = /dev/ttyS9
# Must match AICBT_UART_BAUD_DEFAULT in the kernel BSP (currently 1500000).
# Changing this value alone does not change the controller's UART baud rate.
baud = 1500000
command_timeout = 5
wait_seconds = 30
# Apply the default vendor Wi-Fi/BT coexistence parameters (HCI 0xfc72).
configure_pta = yes
# Empty: preserve a valid controller address; replace zero/vendor placeholder
# addresses with an address derived from board serial / first-boot machine-id.
# Set a unique unicast address here if required.
bdaddr =
